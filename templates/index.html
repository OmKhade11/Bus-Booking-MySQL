<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Bus</title> <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            /* Changed background image to a Bus theme */
            background-image: 
                url('https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Slightly more opaque for readability */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .header i {
            font-size: 1.75rem;
            color: #e04f00; /* Changed color to orange/red for Bus theme vibe */
        }
        .header h2 {
            margin: 0;
            font-weight: 700;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        legend {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e04f00; /* Matching new theme color */
            padding: 0 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        .icon-group {
            position: relative;
        }
        .icon-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.9rem;
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }
        .form-row .form-group {
            flex: 1;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            padding-left: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box; 
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #e04f00;
            box-shadow: 0 0 0 3px rgba(224, 79, 0, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 6px;
            background-color: #e04f00; /* Orange button */
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #b33f00;
            transform: translateY(-2px);
        }

        .flash {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            border: 1px solid transparent;
        }
        .flash i {
            font-size: 1.2rem;
        }
        .flash.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .flash.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <i class="fas fa-bus"></i> <h2>Bus Ticket Booking</h2>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              {% if category == 'success' %}
                <div class="flash success">
                    <i class="fas fa-check-circle"></i>
                    <span>{{ message }}</span>
                </div>
              {% else %}
                <div class="flash error">
                    <i class="fas fa-times-circle"></i>
                    <span>{{ message }}</span>
                </div>
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/book" method="POST">
            <fieldset>
                <legend>Booking Details</legend>
                <div class="form-group">
                    <label for="user_id">User ID</label>
                    <div class="icon-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="user_id" name="user_id" value="1" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bus_id">Bus ID</label>
                    <div class="icon-group">
                        <i class="fas fa-bus-simple"></i> <input type="text" id="bus_id" name="bus_id" value="1" required> 
                    </div>
                </div>
                <div class="form-group">
                    <label for="travel_date">Date of Journey</label>
                    <div class="icon-group">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="travel_date" name="travel_date" required>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Passenger Details</legend>
                <div class="form-group">
                    <label for="passenger_name">Full Name</label>
                    <div class="icon-group">
                        <i class="fas fa-user-edit"></i>
                        <input type="text" id="passenger_name" name="passenger_name" placeholder="e.g., John Doe" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="passenger_age">Age</label>
                        <div class="icon-group">
                            <i class="fas fa-hashtag"></i>
                            <input type="number" id="passenger_age" name="passenger_age" min="1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="passenger_gender">Gender</label>
                        <div class="icon-group">
                            <i class="fas fa-venus-mars"></i>
                            <select id="passenger_gender" name="passenger_gender">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                                <option value="O">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
            </fieldset>
            
            <button type="submit" class="btn">Book Bus Ticket</button>
        </form>
    </div>

</body>
</html>
